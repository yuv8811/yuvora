<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#F8FAFC"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#E2E8F0"/>
  <circle cx="36" cy="28" r="7" fill="#EF4444"/>
  <circle cx="58" cy="28" r="7" fill="#F59E0B"/>
  <circle cx="80" cy="28" r="7" fill="#10B981"/>
  <text x="120" y="34" font-family="-apple-system, sans-serif" font-size="14" fill="#64748B">Reviora • Customer Reviews &amp; Social UGC Grid</text>

  <!-- Product Rating Header -->
  <g transform="translate(80, 90)">
    <text x="0" y="30" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#0F172A">Customer Reviews</text>
    <text x="0" y="65" font-family="-apple-system, sans-serif" font-size="36" font-weight="800" fill="#0071E3">4.9</text>
    <text x="70" y="62" font-family="-apple-system, sans-serif" font-size="20" fill="#F59E0B">★★★★★</text>
    <text x="160" y="62" font-family="-apple-system, sans-serif" font-size="14" fill="#64748B">Based on 1,420 verified buyer ratings</text>

    <!-- Write a Review Button -->
    <rect x="860" y="24" width="180" height="46" rx="8" fill="#0071E3"/>
    <text x="950" y="52" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Write a Review</text>
  </g>

  <!-- Photo Strip -->
  <g transform="translate(80, 190)">
    <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">CUSTOMER PHOTO GALLERY (320+)</text>
    <rect x="0" y="36" width="190" height="150" rx="12" fill="#E2E8F0"/>
    <rect x="210" y="36" width="190" height="150" rx="12" fill="#CBD5E1"/>
    <rect x="420" y="36" width="190" height="150" rx="12" fill="#E2E8F0"/>
    <rect x="630" y="36" width="190" height="150" rx="12" fill="#CBD5E1"/>
    <rect x="840" y="36" width="200" height="150" rx="12" fill="#0F172A"/>
    <text x="940" y="118" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">+315 More</text>
  </g>

  <!-- Review Cards -->
  <g transform="translate(80, 420)">
    <!-- Review 1 -->
    <rect x="0" y="0" width="505" height="280" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="38" font-family="-apple-system, sans-serif" font-size="16" fill="#F59E0B">★★★★★</text>
    <text x="120" y="37" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#16A34A">Verified Buyer</text>
    <text x="24" y="70" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Unbelievable quality and fit</text>
    <text x="24" y="100" font-family="-apple-system, sans-serif" font-size="14" fill="#475569">"Shipped faster than expected. The material feels ultra-premium and washes without shrinking at all. Will definitely be ordering the charcoal version next week!"</text>
    <circle cx="44" cy="225" r="20" fill="#3B82F6"/>
    <text x="44" y="231" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">JD</text>
    <text x="74" y="222" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#0F172A">James D.</text>
    <text x="74" y="240" font-family="-apple-system, sans-serif" font-size="12" fill="#64748B">Purchased: Organic Linen Overshirt • 3 days ago</text>

    <!-- Review 2 -->
    <rect x="535" y="0" width="505" height="280" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="559" y="38" font-family="-apple-system, sans-serif" font-size="16" fill="#F59E0B">★★★★★</text>
    <text x="655" y="37" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#16A34A">Verified Buyer</text>
    <text x="559" y="70" font-family="-apple-system, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Best online shopping experience</text>
    <text x="559" y="100" font-family="-apple-system, sans-serif" font-size="14" fill="#475569">"Love the photo reviews on the page—they helped me pick the right size with confidence. Reviora made leaving this review super effortless via email."</text>
    <circle cx="579" cy="225" r="20" fill="#8B5CF6"/>
    <text x="579" y="231" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">SL</text>
    <text x="609" y="222" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Sophia L.</text>
    <text x="609" y="240" font-family="-apple-system, sans-serif" font-size="12" fill="#64748B">Purchased: Tailored Wool Trousers • 1 week ago</text>
  </g>
</svg>

