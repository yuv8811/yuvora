<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <rect width="1200" height="800" fill="#0F172A"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#1E293B"/>
  <circle cx="36" cy="28" r="7" fill="#EF4444"/>
  <circle cx="58" cy="28" r="7" fill="#F59E0B"/>
  <circle cx="80" cy="28" r="7" fill="#10B981"/>
  <text x="120" y="34" font-family="-apple-system, sans-serif" font-size="14" fill="#94A3B8">Reviora Merchant Dashboard • Review Request Automation &amp; Schema</text>
  <rect x="1030" y="16" width="134" height="26" rx="6" fill="#10B981"/>
  <text x="1050" y="33" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Sequence Active</text>

  <!-- Metric row -->
  <g transform="translate(60, 90)">
    <rect width="250" height="110" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="24" y="36" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Requests Sent (30d)</text>
    <text x="24" y="74" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">14,820</text>
    <text x="24" y="94" font-family="-apple-system, sans-serif" font-size="12" fill="#10B981">↑ 18% vs prev period</text>

    <rect x="280" width="250" height="110" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="304" y="36" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Submission Rate</text>
    <text x="304" y="74" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">11.4%</text>
    <text x="304" y="94" font-family="-apple-system, sans-serif" font-size="12" fill="#10B981">Industry avg: 4.2%</text>

    <rect x="560" width="250" height="110" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="584" y="36" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Photo / Video UGC</text>
    <text x="584" y="74" font-family="-apple-system, sans-serif" font-size="30" font-weight="700" fill="#3B82F6">68.2%</text>
    <text x="584" y="94" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">High buyer authenticity</text>

    <rect x="840" width="240" height="110" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="864" y="36" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Google Schema Status</text>
    <text x="864" y="74" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#10B981">Active &amp; Valid</text>
    <text x="864" y="94" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">Rich snippets enabled</text>
  </g>

  <!-- Flow builder visual -->
  <g transform="translate(60, 240)">
    <rect width="1080" height="500" rx="16" fill="#1E293B"/>
    <text x="40" y="50" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Post-Purchase Review Request Flow</text>
    <text x="40" y="76" font-family="-apple-system, sans-serif" font-size="14" fill="#94A3B8">Automatically synchronizes with carrier tracking via Shopify Fulfillment webhook.</text>

    <!-- Node 1 -->
    <rect x="40" y="120" width="280" height="130" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/>
    <text x="64" y="156" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Trigger: Order Delivered</text>
    <text x="64" y="184" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">Confirmed via carrier tracking</text>
    <text x="64" y="218" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#3B82F6">Delay: 3 Days</text>

    <!-- Arrow -->
    <path d="M330 185H390" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Node 2 -->
    <rect x="400" y="120" width="300" height="130" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="424" y="156" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Email: How was your order?</text>
    <text x="424" y="184" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">1-click rating stars inside email</text>
    <text x="424" y="218" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#10B981">Open Rate: 64.8%</text>

    <!-- Arrow -->
    <path d="M710 185H770" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Node 3 -->
    <rect x="780" y="120" width="260" height="130" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <text x="804" y="156" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Reward Incentive</text>
    <text x="804" y="184" font-family="-apple-system, sans-serif" font-size="13" fill="#94A3B8">15% off next purchase for photo/video</text>
    <text x="804" y="218" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#F59E0B">Repeat Purchase Lift: +28%</text>

    <!-- Schema Code snippet box -->
    <rect x="40" y="280" width="1000" height="180" rx="10" fill="#0F172A"/>
    <text x="64" y="315" font-family="monospace" font-size="13" fill="#10B981">// Automated Google Schema Markup (JSON-LD)</text>
    <text x="64" y="340" font-family="monospace" font-size="13" fill="#94A3B8">{"@context": "https://schema.org/", "@type": "Product", "name": "Organic Linen Overshirt",</text>
    <text x="64" y="365" font-family="monospace" font-size="13" fill="#94A3B8"> "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.9", "reviewCount": "1420" }}</text>
    <text x="64" y="415" font-family="-apple-system, sans-serif" font-size="13" fill="#3B82F6">✓ Verified by Google Rich Results Test • Zero manual template editing</text>
  </g>
</svg>

