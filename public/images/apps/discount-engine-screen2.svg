<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <rect width="1200" height="800" fill="#F8FAFC"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#E2E8F0"/>
  <circle cx="36" cy="28" r="7" fill="#EF4444"/>
  <circle cx="58" cy="28" r="7" fill="#F59E0B"/>
  <circle cx="80" cy="28" r="7" fill="#10B981"/>
  <text x="120" y="34" font-family="-apple-system, sans-serif" font-size="14" fill="#64748B">Shopify Online Store • Slide Cart Spend Bar &amp; Tiered Free Gift</text>

  <!-- Storefront background preview -->
  <rect x="40" y="80" width="680" height="680" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="70" y="130" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#1E293B">Modern Minimalist Store</text>
  <rect x="70" y="160" width="280" height="260" rx="12" fill="#F1F5F9"/>
  <rect x="380" y="160" width="280" height="260" rx="12" fill="#F1F5F9"/>
  <text x="70" y="450" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Organic Linen Overshirt</text>
  <text x="70" y="475" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#0071E3">$88.00</text>
  <text x="380" y="450" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Tailored Wool Trousers</text>
  <text x="380" y="475" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#0071E3">$120.00</text>

  <!-- Cart Drawer Overlay -->
  <rect x="760" y="56" width="440" height="744" fill="#FFFFFF"/>
  <line x1="760" y1="56" x2="760" y2="800" stroke="#E2E8F0"/>
  
  <text x="800" y="110" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Your Shopping Bag (2)</text>
  
  <!-- Dynamic Spend Bar Widget -->
  <rect x="790" y="140" width="380" height="96" rx="12" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="810" y="172" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#15803D">🎉 Only $12.00 away from a Free Silk Tote Bag!</text>
  <!-- Progress track -->
  <rect x="810" y="192" width="340" height="10" rx="5" fill="#DCFCE7"/>
  <rect x="810" y="192" width="280" height="10" rx="5" fill="#16A34A"/>

  <!-- Cart Item 1 -->
  <rect x="790" y="260" width="70" height="70" rx="8" fill="#F1F5F9"/>
  <text x="876" y="285" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Organic Linen Overshirt</text>
  <text x="876" y="308" font-family="-apple-system, sans-serif" font-size="13" fill="#64748B">Size: M • Color: Sand</text>
  <text x="876" y="328" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">$88.00</text>

  <!-- Cart Item 2 -->
  <rect x="790" y="360" width="70" height="70" rx="8" fill="#F1F5F9"/>
  <text x="876" y="385" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Tailored Wool Trousers</text>
  <text x="876" y="408" font-family="-apple-system, sans-serif" font-size="13" fill="#64748B">Size: 32 • Color: Charcoal</text>
  <text x="876" y="428" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#0F172A">$120.00</text>

  <!-- Summary Box -->
  <rect x="790" y="580" width="380" height="170" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="814" y="614" font-family="-apple-system, sans-serif" font-size="14" fill="#64748B">Subtotal</text>
  <text x="1110" y="614" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#0F172A" text-anchor="end">$208.00</text>
  <text x="814" y="644" font-family="-apple-system, sans-serif" font-size="14" fill="#15803D">Bundle Discount (15%)</text>
  <text x="1110" y="644" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803D" text-anchor="end">-$31.20</text>
  
  <rect x="814" y="680" width="332" height="48" rx="8" fill="#0071E3"/>
  <text x="980" y="710" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Proceed to Checkout • $176.80</text>
</svg>

